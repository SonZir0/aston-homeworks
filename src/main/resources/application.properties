server.port=8080
spring.application.name=user-service

# for standalone running. Config server overrides this with true
eureka.client.enabled=false

spring.config.import=optional:configserver:http://localhost:8888

spring.datasource.url=jdbc:postgresql://localhost:5432/MyDB
spring.datasource.username=postgres
spring.datasource.password=12345
spring.jpa.hibernate.ddl-auto=update

# Format the SQL for readability
spring.jpa.properties.hibernate.format_sql=true
# Log the SQL statements
logging.level.org.hibernate.SQL=DEBUG
# Log the binding parameters (for modern Spring Boot 3+ / Hibernate 6+)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

app.kafka.topics.my-topic=emailNotifications
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
